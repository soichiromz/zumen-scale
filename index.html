<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>図面三角スケール</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="図面スケール">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f9f6">
<style>
*,*::before,*::after{box-sizing:border-box}

/* Layout: full-screen drafting desk. Header bar on top, drawing canvas fills the middle, tool tray floats at the bottom. */
:root{
  --desk:#cfd4cd; --chrome:#f8f9f6; --chrome-2:#eceee9; --ink:#1a2421; --muted:#5d6964; --line:#c3c9c2;
  --accent:#1f5fd0; --accent-ink:#ffffff; --accent-soft:#dfe8fa; --warn:#a6461a; --scrim:rgba(20,26,24,.42);
  --shadow:0 1px 2px rgba(0,0,0,.08),0 6px 20px rgba(20,30,26,.14);
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#191d1c; --chrome:#242927; --chrome-2:#2d3330; --ink:#e4e9e6; --muted:#9aa5a0; --line:#3b423f;
  --accent:#7aa2ff; --accent-ink:#0d1420; --accent-soft:#25324d; --warn:#f09a6a; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#191d1c; --chrome:#242927; --chrome-2:#2d3330; --ink:#e4e9e6; --muted:#9aa5a0; --line:#3b423f;
  --accent:#7aa2ff; --accent-ink:#0d1420; --accent-soft:#25324d; --warn:#f09a6a; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--chrome);border-bottom:1px solid var(--line);
  padding-top:max(8px,env(safe-area-inset-top,0px));min-width:0;z-index:5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--chrome);cursor:pointer;white-space:nowrap;font-size:14px}
.btn:active{background:var(--chrome-2)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.icon{width:40px;padding:0}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn svg{width:20px;height:20px;flex:none}
.titlebox{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
#docTitle{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
#pageTitle{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;align-items:center;gap:4px}
#pageNo{font-family:var(--f-num);font-size:13px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
#stage{position:relative;overflow:hidden;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#loupe{position:absolute;width:140px;height:140px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);background:#fff}
/* readout */
#readout{position:absolute;top:10px;right:10px;background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:8px 12px;display:grid;grid-template-columns:auto auto;gap:2px 12px;align-items:baseline;max-width:calc(100% - 20px);pointer-events:auto}
#readout .k{font-size:11px;color:var(--muted);letter-spacing:.04em}
#readout .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px;text-align:right;white-space:nowrap}
#readout .v.big{font-size:20px;font-weight:600;color:var(--accent)}
#readout .v small{font-size:11px;color:var(--muted);margin-left:3px;font-family:var(--f-body)}
/* tools */
.tray{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(980px,calc(100% - 20px));
  background:var(--chrome);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:8px;z-index:4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.seg{display:inline-flex;background:var(--chrome-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:36px;padding:0 14px;border-radius:8px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--chrome);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600;color:var(--accent)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.spacer{flex:1}
.faces{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding:2px 1px;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.faces::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--chrome);cursor:pointer;
  font-family:var(--f-num);font-size:13.5px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:2px;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--chrome);border-color:var(--ink)}
.chip.found{border-style:dashed}
.sep{flex:none;width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
.lbl{flex:none;font-size:11px;color:var(--muted);letter-spacing:.06em;align-self:center;padding:0 2px}
/* drawer */
#lib{position:absolute;inset:0;z-index:20;display:flex}
#lib .scrim{position:absolute;inset:0;background:var(--scrim)}
#lib .panel{position:relative;width:min(460px,100%);height:100%;background:var(--chrome);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.phead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:17px;flex:1;text-wrap:balance}
.plist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 40px;flex:1;touch-action:pan-y}
.set{padding:10px 0 4px}
.set h3{margin:8px 0 2px;font-size:14px;line-height:1.4}
.set .meta{font-size:11.5px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--f-num);font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--chrome-2);color:var(--muted);letter-spacing:.03em}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.ng{background:transparent;border:1px solid var(--line)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.pg{border:1px solid var(--line);border-radius:10px;background:var(--chrome);padding:6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.pg[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pg .th{aspect-ratio:1.414/1;width:100%;background:#fff;border-radius:5px;display:block;object-fit:contain;border:1px solid var(--line)}
.pg .t{font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pg .n{font-family:var(--f-num);font-size:10.5px;color:var(--muted)}
.note{font-size:12.5px;line-height:1.65;color:var(--muted);background:var(--chrome-2);border-radius:10px;padding:10px 12px;margin:8px 0}
.note b{color:var(--ink)}
.note ul{margin:6px 0 0;padding-left:18px}
.dz{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;margin:10px 0}
.dz p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;flex:1}
.linkbtn{background:none;border:0;color:var(--warn);font-size:12px;cursor:pointer;padding:4px 0;text-decoration:underline}
/* sheet (dialogs) */
#sheet{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
#sheet .card{position:relative;width:min(440px,100%);background:var(--chrome);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
#sheet h4{margin:0;font-size:16px}
#sheet p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.field input{font-family:var(--f-num);font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--chrome-2);color:var(--ink);width:100%;box-sizing:border-box}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--chrome);cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .x{font-family:var(--f-num);color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:9px 14px;border-radius:10px;font-size:13px;
  box-shadow:var(--shadow);max-width:calc(100% - 32px);line-height:1.45;z-index:8;pointer-events:none;transition:opacity .2s}
#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#busy span{background:var(--chrome);border:1px solid var(--line);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px}
@media (max-width:640px){
  #readout{top:8px;right:8px;left:8px;grid-template-columns:repeat(4,auto);justify-content:space-between}
  .seg button span{display:none}
  .btn .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <button class="btn" id="libBtn" aria-label="図面一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="7" height="6" rx="1"/><rect x="13.5" y="4.5" width="7" height="6" rx="1"/><rect x="3.5" y="13.5" width="7" height="6" rx="1"/><rect x="13.5" y="13.5" width="7" height="6" rx="1"/></svg><span class="hide-s">図面一覧</span></button>
    <div class="titlebox"><div id="docTitle">読み込み中…</div><div id="pageTitle"></div></div>
    <div class="pager">
      <button class="btn icon" id="prevBtn" aria-label="前の図面"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="pageNo">–</span>
      <button class="btn icon" id="nextBtn" aria-label="次の図面"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="btn" id="fitBtn" aria-label="全体表示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="hide-s">全体</span></button>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <canvas id="loupe" hidden></canvas>
    <div id="readout" aria-live="polite"></div>
    <div id="toast" hidden></div>
    <div id="busy" hidden><span id="busyText">読み込み中…</span></div>

    <div class="tray" id="tray">
      <div class="row">
        <div class="seg" id="modeSeg" role="group" aria-label="操作モード">
          <button data-mode="pan" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span>移動</span></button>
          <button data-mode="measure" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M6.5 16.5l11-9"/></svg><span>計測</span></button>
          <button data-mode="calib" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18h16M4 14v8M20 14v8M12 3v8M9 8l3 3 3-3"/></svg><span>校正</span></button>
        </div>
        <button class="btn toggle" id="rulerBtn" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 16L16 3l5 5L8 21z"/><path d="M7 12l2 2M10 9l2 2M13 6l2 2"/></svg>三角スケール</button>
        <button class="btn toggle" id="snapBtn" aria-pressed="true" title="線の端点に吸着"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="8" height="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span class="hide-s">吸着</span></button>
        <span class="spacer"></span>
        <button class="btn" id="paperBtn" title="用紙の縮小率">用紙 ×1</button>
        <button class="btn icon" id="delBtn" aria-label="計測を削除" title="選択した計測を削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      </div>
      <div class="row">
        <span class="lbl">縮尺</span>
        <div class="faces" id="faces" role="group" aria-label="スケール面"></div>
      </div>
    </div>
  </main>

  <aside id="lib" hidden>
    <div class="scrim" data-close></div>
    <div class="panel" role="dialog" aria-label="図面一覧">
      <div class="phead"><h2>図面一覧</h2><button class="btn icon" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="plist" id="plist"></div>
    </div>
  </aside>
  <div id="sheet" hidden><div class="scrim" data-sclose></div><div class="card" id="sheetCard"></div></div>
  <input type="file" id="fileIn" multiple hidden>
</div>

<script src="lib/pdf.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script>
'use strict';
/* ====================== bundled drawings ====================== */
const BUNDLE = [];

/* ====================== utils ====================== */
const $ = s => document.querySelector(s);
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = (v, d=0) => v.toLocaleString('ja-JP', {minimumFractionDigits:d, maximumFractionDigits:d});
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const IDB = {
  db:null,
  open(){ if(this._p) return this._p; this._p = new Promise(res=>{ try{ const r = indexedDB.open('tscale-docs',1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('docs',{keyPath:'id'});
      r.onsuccess = ()=>{ this.db = r.result; res(r.result); }; r.onerror = ()=>res(null); }catch(e){ res(null); } }); return this._p; },
  async tx(mode, fn){ const db = await this.open(); if(!db) return null; return new Promise(res=>{ try{ const t = db.transaction('docs', mode); const st = t.objectStore('docs'); const rq = fn(st); t.oncomplete = ()=>res(rq && rq.result); t.onerror = ()=>res(null); }catch(e){ res(null); } }); },
  all(){ return this.tx('readonly', st=>st.getAll()).then(r=>r||[]); },
  put(o){ return this.tx('readwrite', st=>st.put(o)); },
  del(id){ return this.tx('readwrite', st=>st.delete(id)); }
};
let toastT;
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; t.style.opacity='1'; clearTimeout(toastT); toastT=setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.hidden=true,220); }, ms); }
function busy(on, text){ $('#busy').hidden = !on; if(text) $('#busyText').textContent = text; }
function decodeName(bytes){ try{ return new TextDecoder('utf-8',{fatal:true}).decode(bytes); }catch(e){ try{ return new TextDecoder('shift_jis').decode(bytes); }catch(e2){ return String.fromCharCode(...bytes); } } }
function extOf(n){ const m=/\.([^.\/]+)$/.exec(n); return m?m[1].toLowerCase():''; }
function baseName(n){ return n.split('/').pop().replace(/\.[^.]+$/,''); }

/* ====================== snap index ====================== */
class SnapIndex{
  constructor(cell=3){ this.cell=cell; this.map=new Map(); this.n=0; }
  add(x,y){ if(!isFinite(x)||!isFinite(y)||this.n>600000) return; const k=Math.floor(x/this.cell)+','+Math.floor(y/this.cell); let a=this.map.get(k); if(!a){a=[];this.map.set(k,a);} for(let i=0;i<a.length;i+=2){ if(Math.abs(a[i]-x)<1e-3&&Math.abs(a[i+1]-y)<1e-3) return; } a.push(x,y); this.n++; }
  near(x,y,r){ const c=this.cell, x0=Math.floor((x-r)/c), x1=Math.floor((x+r)/c), y0=Math.floor((y-r)/c), y1=Math.floor((y+r)/c); let best=null, bd=r*r;
    if((x1-x0)*(y1-y0)>400) return null;
    for(let i=x0;i<=x1;i++) for(let j=y0;j<=y1;j++){ const a=this.map.get(i+','+j); if(!a) continue; for(let q=0;q<a.length;q+=2){ const dx=a[q]-x, dy=a[q+1]-y, d=dx*dx+dy*dy; if(d<bd){bd=d; best=[a[q],a[q+1]];} } }
    return best; }
}

/* ====================== SXF (SFC) parser ====================== */
const SXF_RGB = [null,[0,0,0],[255,0,0],[0,255,0],[0,0,255],[255,255,0],[255,0,255],[0,255,255],[255,255,255],[192,0,128],[192,128,64],[255,128,0],[128,192,128],[0,128,255],[128,64,255],[192,192,192],[128,128,128]];
const SXF_DASH = [null,[],[3,1],[3,3],[12,1.5,.5,1.5],[12,1.5,.5,1.5,.5,1.5],[12,1.5,.5,1.5,.5,1.5,.5,1.5],[.5,1],[8,1.5,2,1.5],[8,1.5,2,1.5,2,1.5],[3,1,.5,1],[3,1,3,1,.5,1],[3,1,.5,1,.5,1],[3,1,3,1,.5,1,.5,1],[3,1,.5,1,.5,1,.5,1],[3,1,3,1,.5,1,.5,1,.5,1]];
const SXF_W = [null,.13,.18,.25,.35,.5,.7,1,1.4,2];
const SHEETS = {0:[1189,841],1:[841,594],2:[594,420],3:[420,297],4:[297,210]};
function paperColor(rgb){ const [r,g,b]=rgb; const L=(0.299*r+0.587*g+0.114*b)/255;
  if(L>0.86) return '#111'; if(r>200&&g>200&&b<80) return '#9a8600'; if(g>200&&b>200&&r<80) return '#008a99'; if(g>230&&r<80&&b<80) return '#1f9a2e';
  return `rgb(${r},${g},${b})`; }
function decX(s){ return s.replace(/\\X2\\([0-9A-F]+)\\X0\\/gi,(m,h)=>{ let o=''; for(let i=0;i+3<h.length;i+=4) o+=String.fromCharCode(parseInt(h.substr(i,4),16)); return o; }); }
function sxfArgs(s){
  const out=[]; let i=0; const n=s.length;
  while(i<n){
    const c=s[i];
    if(c===','||c===' '||c==='\t'){ i++; continue; }
    if(c==='\\' && s[i+1]==="'"){ let j=s.indexOf("\\'",i+2); if(j<0) j=n; out.push(decX(s.slice(i+2,j))); i=j+2; }
    else if(c==="'"){ let j=s.indexOf("'",i+1); if(j<0) j=n; out.push(s.slice(i+1,j)); i=j+1; }
    else { let j=s.indexOf(',',i); if(j<0) j=n; out.push(s.slice(i,j).trim()); i=j; }
  }

async function openPage(doc, i){
  if(!doc) return; i=clamp(i,0,doc.count-1);
  S.token++; const tok=S.token; busy(true,'図面を開いています…');
  if(S.hiTask){ try{S.hiTask.cancel();}catch(e){} S.hiTask=null; }
  let src; try{ src=await doc.open(i); }catch(e){ busy(false); toast('図面を開けませんでした：'+(e.message||e)); return; }
  if(tok!==S.token) return;
  S.doc=doc; S.pi=i; S.src=src; S.base=null; S.hi=null; S.sel=-1; S.pending=null;
  if(doc.kind==='pdf' && !doc.titles){ try{ const pdf=await getPdf(doc); doc.count=pdf.numPages; }catch(e){} }
  S.st=LS.get(stKey(),null) || defaultState(src);
  src.onmeta=()=>{ if(S.src!==src) return; if(!LS.get(stKey(),null) && !S.st._touched){ const found=[...src.scales]; if(found.length && S.st.den===100 && !found.includes(100)) S.st.den=found[0]; }
    renderFaces(); updateReadout(); const sb=$('#snapBtn'); sb.disabled=!src.snaps; };
  $('#snapBtn').disabled=!src.snaps;
  $('#docTitle').textContent=doc.title; $('#pageTitle').textContent=(doc.titles&&doc.titles[i])||('ページ '+(i+1));
  $('#pageNo').textContent=(i+1)+' / '+doc.count;
  LS.set('tscale:last',{id:doc.id,pi:i});
  renderFaces(); updateReadout(); fit(); busy(false);
  buildBase(); scheduleHi();
  if(src.needsCalib && !LS.get(stKey(),null)) toast('画像は縮尺が不明です。「校正」で寸法のわかる2点を指定してください。',4500);
}

/* ====================== pointer input ====================== */
const P=new Map(); // id -> {x,y,type}
function local(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
function snapAt(sx,sy,force){
  const [x,y]=toP(sx,sy); if(!S.snap||!S.src||!S.src.snaps) return {p:[x,y],snapped:false};
  const q=S.src.snaps.near(x,y,16/S.z); if(q) return {p:q,snapped:true}; return {p:[x,y],snapped:false};
}
function hitRuler(sx,sy){
  const st=S.st; if(!st||!st.ruler.on) return null; const g=rulerGeom();
  const u=(sx-g.px)*g.dx+(sy-g.py)*g.dy, v=(sx-g.px)*g.nx+(sy-g.py)*g.ny;
  const ku=rotKnobU(g); if(Math.hypot(u-ku,v-RT/2)<24) return {type:'rotate'};
  const cu=st.ruler.cu/st.k*S.z; if(Math.hypot(u-cu,v-(RT+2))<22 || (Math.abs(u-cu)<10 && v>-36 && v<0)) return {type:'cursor'};
  if(u>=-10 && u<=g.L+10 && v>=-6 && v<=RT+4) return {type:'ruler',u};
  return null;
}
function hitMeasure(sx,sy){
  const ms=S.st?S.st.ms:[];
  for(let i=ms.length-1;i>=0;i--){ for(const end of ['a','b']){ const [x,y]=toS(...ms[i][end]); if(Math.hypot(sx-x,sy-y)<20) return {type:'mend',i,end}; } }
  for(const b of labelBoxes){ if(Math.hypot(sx-b.x,sy-b.y)<b.r) return {type:'mlabel',i:b.i}; }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  if(!S.src) return; cv.setPointerCapture(e.pointerId);

    if(S.drag && S.drag.type==='place'){ S.pending = S.drag.prevPending; }
    hideLoupe(); S.snapHint=null;
    const [p1,p2]=[...P.values()]; S.drag={type:'pinch', z0:S.z, ox0:S.ox, oy0:S.oy, c0:[(p1.x+p2.x)/2,(p1.y+p2.y)/2], d0:Math.hypot(p1.x-p2.x,p1.y-p2.y)||1};
    draw(); return;
  }
  if(P.size>2) return;
  const hm=hitMeasure(x,y);
  if(hm && hm.type==='mend'){ S.sel=hm.i; S.drag={type:'mend',i:hm.i,end:hm.end,sx:x,sy:y,moved:false}; updateReadout(); draw(); return; }
  const hr=hitRuler(x,y);
  if(hr){
    const r=S.st.ruler;
    if(hr.type==='rotate') S.drag={type:'rotate'};
    else if(hr.type==='cursor') S.drag={type:'cursor'};
    else S.drag={type:'ruler', sx:x, sy:y, rx:r.x, ry:r.y, moved:false, u:hr.u};
    S.st._touched=true; return;
  }
  if(hm && hm.type==='mlabel'){ S.drag={type:'tapsel',i:hm.i,sx:x,sy:y}; return; }

    const s=snapAt(x,y); S.drag={type:'place', prevPending:S.pending?{...S.pending}:null, sx:x, sy:y, t0:performance.now()};
    placeUpdate(s); showLoupe(x,y); return;
  }

});
function placeUpdate(s){
  S.snapHint = s.snapped ? s.p : null;

  else { S.pending={a:S.drag.prevPending.a, b:s.p, calib:S.mode==='calib'}; }

}
cv.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId)) return; const [x,y]=local(e); const p=P.get(e.pointerId); p.x=x; p.y=y;
  const d=S.drag; if(!d) return;
  if(d.type==='pinch' && P.size>=2){ const [p1,p2]=[...P.values()]; const c=[(p1.x+p2.x)/2,(p1.y+p2.y)/2], dist=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    const z=clamp(d.z0*dist/d.d0, zMin(), zMax); const px=(d.c0[0]-d.ox0)/d.z0, py=(d.c0[1]-d.oy0)/d.z0; S.z=z; S.ox=c[0]-px*z; S.oy=c[1]-py*z; draw(); scheduleHi(); return; }
  if(d.type==='pan'){ if(Math.hypot(x-d.sx,y-d.sy)>3) d.moved=true; S.ox=d.ox0+(x-d.sx); S.oy=d.oy0+(y-d.sy); draw(); scheduleHi(); return; }
  if(d.type==='place'){ placeUpdate(snapAt(x,y)); showLoupe(x,y); return; }
  if(d.type==='mend'){ d.moved=true; const s=snapAt(x,y); S.snapHint=s.snapped?s.p:null; S.st.ms[d.i][d.end]=s.p; showLoupe(x,y); updateReadout(); draw(); return; }
  if(d.type==='ruler'){ if(Math.hypot(x-d.sx,y-d.sy)>4) d.moved=true; if(!d.moved) return;
    const r=S.st.ruler; let nx=d.rx+(x-d.sx)/S.z, ny=d.ry+(y-d.sy)/S.z; S.snapHint=null;
    if(S.snap && S.src.snaps){ const q=S.src.snaps.near(nx,ny,12/S.z); if(q){ nx=q[0]; ny=q[1]; S.snapHint=q; } }
    r.x=nx; r.y=ny; draw(); return; }
  if(d.type==='rotate'){ const r=S.st.ruler; const [px,py]=toS(r.x,r.y); let a=Math.atan2(y-py-RT/2*Math.cos(r.a), x-px+RT/2*Math.sin(r.a));
    a=Math.atan2(y-py,x-px); const deg=a*180/Math.PI; for(const s of [0,45,90,135,180,-45,-90,-135,-180]){ if(Math.abs(deg-s)<(s%90===0?2.5:1.5)){ a=s*Math.PI/180; break; } }
    r.a=a; draw(); return; }
  if(d.type==='cursor'){ const st=S.st, r=st.ruler, g=rulerGeom(); let u=(x-g.px)*g.dx+(y-g.py)*g.dy; u=clamp(u,0,g.L);
    S.snapHint=null;
    if(S.snap && S.src.snaps){ const ex=g.px+g.dx*u, ey=g.py+g.dy*u; const [qx,qy]=toP(ex,ey); const q=S.src.snaps.near(qx,qy,14/S.z); if(q){ const [sx2,sy2]=toS(q[0],q[1]); u=clamp((sx2-g.px)*g.dx+(sy2-g.py)*g.dy,0,g.L); S.snapHint=q; } }
    r.cu=u/S.z*st.k; showLoupe(g.px+g.dx*u, g.py+g.dy*u); updateReadout(); draw(); return; }
});
function endPointer(e){
  if(!P.has(e.pointerId)) return; const [x,y]=local(e); P.delete(e.pointerId);
  const d=S.drag; if(!d) return;
  if(d.type==='pinch'){ if(P.size===0) S.drag=null; else S.drag={type:'none'}; return; }
  if(d.type==='none'){ if(P.size===0) S.drag=null; return; }
  S.drag=null; hideLoupe(); S.snapHint=null;
  if(e.type==='pointercancel'){ if(d.type==='place') S.pending=d.prevPending; draw(); return; }
  if(d.type==='pan'){ if(!d.moved && S.sel>=0){ S.sel=-1; updateReadout(); } draw(); return; }
  if(d.type==='tapsel'){ S.sel = S.sel===d.i ? -1 : d.i; updateReadout(); draw(); return; }
  if(d.type==='place'){
    const pd=S.pending; if(!pd){ draw(); return; }
    if(pd.b){ // finished
      if(Math.hypot(pd.b[0]-pd.a[0],pd.b[1]-pd.a[1])*S.z<4){ S.pending={a:pd.a,calib:pd.calib}; draw(); return; }
      S.pending=null;
      if(pd.calib){ openCalib(pd.a,pd.b); }
      else { S.st.ms.push({a:pd.a,b:pd.b,den:S.st.den}); S.sel=S.st.ms.length-1; saveSt(); }
    }
    updateReadout(); draw(); return;
  }
  if(d.type==='mend'){ saveSt(); updateReadout(); draw(); return; }
  if(d.type==='ruler'){ if(!d.moved){ // tap on ruler sets reading cursor
      const g=rulerGeom(); const u=clamp(d.u,0,g.L); S.st.ruler.cu=u/S.z*S.st.k; updateReadout(); }
    saveSt(); draw(); return; }
  if(d.type==='rotate'||d.type==='cursor'){ saveSt(); updateReadout(); draw(); return; }
}
cv.addEventListener('pointerup',endPointer); cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const [x,y]=local(e);

const lp=$('#loupe'), lctx=lp.getContext('2d');
function showLoupe(x,y){
  const dpr=cv._dpr||1, R=70, M=3; if(lp.width!==R*2*dpr){ lp.width=R*2*dpr; lp.height=R*2*dpr; }
  lp.hidden=false; let ly=y-R-90; if(ly<4) ly=y+60; let lx=clamp(x-R,4,S.W-2*R-4); lp.style.left=lx+'px'; lp.style.top=ly+'px';

    const sw=R*2/M*dpr; lctx.imageSmoothingEnabled=false; lctx.drawImage(cv, x*dpr-sw/2, y*dpr-sw/2, sw, sw, 0,0, lp.width, lp.height);

}

  if(!st.ms.length) return;
  openSheet(`<h4>この図面の計測をすべて消しますか？</h4><p>${st.ms.length}件の計測線を削除します。元に戻せません。</p>
   <div class="acts"><button class="btn" data-sclose>やめる</button><button class="btn primary" id="delOk">すべて削除</button></div>`, card=>{
    card.querySelector('[data-sclose]').onclick=closeSheet;
    card.querySelector('#delOk').onclick=()=>{ st.ms=[]; S.sel=-1; saveSt(); updateReadout(); draw(); closeSheet(); };
  });
}

/* ====================== library ====================== */
const thumbCache=new Map(); let thumbQ=[], thumbBusy=false;
function queueThumb(img, doc, i){ thumbQ.push({img,doc,i}); pumpThumbs(); }
async function pumpThumbs(){
  if(thumbBusy) return; thumbBusy=true;
  while(thumbQ.length){ const {img,doc,i}=thumbQ.shift(); if(!img.isConnected) continue; const key=doc.id+'#'+i;
    if(!thumbCache.has(key)){ try{ const src=await doc.open(i); const z=260/Math.max(src.w,src.h); const c=makeCanvas(Math.ceil(src.w*z),Math.ceil(src.h*z),1); const t=src.render(c,z,0,0); if(t&&t.promise) await t.promise; thumbCache.set(key,c.toDataURL('image/jpeg',0.75)); }catch(e){ thumbCache.set(key,''); } }
    const u=thumbCache.get(key); if(u) img.src=u; await new Promise(r=>setTimeout(r,10)); }
  thumbBusy=false;
}
const UNSUPPORTED_NOTE=`<div class="note"><b>開ける形式</b>：PDF・SXF(.sfc)・画像（JPG/PNG）・それらをまとめたZIP
  <ul><li><b>.dcz / .bcz</b>（DynaCAD）は、DynaCADでSXF(.sfc)かPDFに保存してから取り込んでください。</li>
  <li><b>.xdw</b>（DocuWorks）は、DocuWorks DeskでPDFに変換してから取り込んでください。</li>
  <li>取り込んだ図面はこのiPadの中だけに保存され、電波のない場所でも開けます。</li></ul></div>
  <div class="note" id="offState">オフライン準備を確認中…</div>`;
function renderLib(){
  const el=$('#plist'); const cur=S.doc?S.doc.id:'';
  let h=`<div class="dz"><p>PDF・SXF(.sfc)・画像・ZIPをまとめて取り込めます。iPadの「ファイル」からZIPのまま選んでもOKです。</p><button class="btn primary" id="impBtn">取り込む</button></div>`;
  if(!DOCS.length) h+=`<div class="note"><b>まだ図面がありません。</b><br>「取り込む」から、図面のZIP・PDF・SXFファイルを選んでください。iPadの「ファイル」アプリに保存したZIPをそのまま選べます。</div>`;
  for(const d of DOCS){
    h+=`<section class="set"><h3>${esc(d.title)}</h3><div class="meta"><span class="tag ${d.kind==='sfcset'?'ok':''}">${d.kind==='sfcset'?'SXF':d.kind==='img'?'画像':'PDF'}</span><span>${esc(d.sub||'')}</span><span>${d.count}枚</span>${d.imported?`<button class="linkbtn" data-deldoc="${d.id}">一覧から削除</button>`:''}</div>
      ${d.skipped&&d.skipped.length?`<div class="note">未対応のため取り込まなかったファイル：${d.skipped.length}件（${esc([...new Set(d.skipped.map(n=>'.'+extOf(n)))].join(' '))}）</div>`:''}
      <div class="pages">${Array.from({length:d.count},(_,i)=>`<button class="pg" data-doc="${d.id}" data-i="${i}" aria-current="${cur===d.id&&S.pi===i}"><img class="th" alt="" data-th="${d.id}#${i}"><span class="t">${esc((d.titles&&d.titles[i])||('ページ '+(i+1)))}</span></button>`).join('')}</div></section>`;
  }
  h+=UNSUPPORTED_NOTE;
  el.innerHTML=h;
  showOffState();
  const io=new IntersectionObserver(ents=>{ for(const en of ents){ if(en.isIntersecting){ io.unobserve(en.target); const [id,i]=en.target.dataset.th.split('#'); const d=DOCS.find(x=>x.id===id); if(d) queueThumb(en.target,d,+i); } } },{root:el,rootMargin:'200px'});
  el.querySelectorAll('img[data-th]').forEach(im=>{ const u=thumbCache.get(im.dataset.th); if(u) im.src=u; else io.observe(im); });
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function openLib(){ $('#lib').hidden=false; renderLib(); }
function closeLib(){ $('#lib').hidden=true; thumbQ=[]; }
$('#lib').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){ closeLib(); return; }
  const pg=e.target.closest('.pg'); if(pg){ const d=DOCS.find(x=>x.id===pg.dataset.doc); closeLib(); openPage(d,+pg.dataset.i); return; }
  if(e.target.closest('#impBtn')){ $('#fileIn').click(); return; }
  const dd=e.target.closest('[data-deldoc]'); if(dd){ const id=dd.dataset.deldoc; const d=DOCS.find(x=>x.id===id);
    openSheet(`<h4>「${esc(d.title)}」を一覧から削除しますか？</h4><p>取り込んだデータをこの端末から削除します。元のファイルには影響しません。</p><div class="acts"><button class="btn" data-sclose>やめる</button><button class="btn primary" id="ddOk">削除</button></div>`, card=>{
      card.querySelector('[data-sclose]').onclick=closeSheet;
      card.querySelector('#ddOk').onclick=async()=>{ await IDB.del(id); pdfCache.delete(id); closeSheet(); await refreshDocs(); renderLib(); if(S.doc&&S.doc.id===id){ if(DOCS[0]) openPage(DOCS[0],0); else { S.src=null; S.st=null; S.doc=null; draw(); } } };
    }); }
});

/* ====================== import ====================== */
$('#fileIn').addEventListener('change',async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  busy(true,'取り込み中…'); let added=0, skipped=[], firstId=null;
  const sfcGroups=new Map();
  const handle=async(name, blob, group)=>{
    const x=extOf(name);
    if(x==='pdf'){ const id='imp-'+Date.now()+'-'+Math.random().toString(36).slice(2,7); let pages=1; try{ const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise; pages=pdf.numPages; pdf.destroy(); }catch(err){ skipped.push(name); return; }
      await IDB.put({id,kind:'pdf',name:baseName(name),files:[{name,blob}],pages,added:Date.now()+added}); added++; firstId=firstId||id; return; }
    if(x==='sfc'){ const g=group||'SXF'; if(!sfcGroups.has(g)) sfcGroups.set(g,[]); sfcGroups.get(g).push({name,blob}); return; }
    if(['png','jpg','jpeg','webp','gif','heic'].includes(x)){ const id='imp-'+Date.now()+'-'+Math.random().toString(36).slice(2,7); await IDB.put({id,kind:'img',name:baseName(name),files:[{name,blob}],added:Date.now()+added}); added++; firstId=firstId||id; return; }
    if(x==='thumbs.db'||/thumbs\.db$/i.test(name)||x==='db') return;
    skipped.push(name);
  };
  try{
    for(const f of files){
      if(extOf(f.name)==='zip'){
        const zip=await JSZip.loadAsync(f,{decodeFileName:decodeName}); const ents=Object.values(zip.files).filter(z=>!z.dir).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
        for(const z of ents){ const blob=await z.async('blob'); const dir=z.name.split('/').slice(0,-1).join('/'); await handle(z.name, blob, baseName(f.name)+(dir?' / '+dir.split('/').pop():'')); }
      } else await handle(f.name, f, 'SXF '+new Date().toLocaleDateString('ja-JP'));
    }
    for(const [g,list] of sfcGroups){ list.sort((a,b)=>a.name.localeCompare(b.name,'ja',{numeric:true})); const id='imp-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
      await IDB.put({id,kind:'sfcset',name:g,files:list,added:Date.now()+added,skipped:[]}); added++; firstId=firstId||id; }
  }catch(err){ busy(false); toast('取り込みに失敗しました：'+(err.message||err),4000); return; }
  await refreshDocs(); busy(false);
  const sk=skipped.filter(n=>!/thumbs\.db$/i.test(n));
  if(added){ toast(`${added}件を取り込みました`+(sk.length?`（未対応 ${sk.length}件：${[...new Set(sk.map(n=>'.'+extOf(n)))].join(' ')}）`:''),4500); if(!$('#lib').hidden) renderLib(); const d=DOCS.find(x=>x.id===firstId); if(d){ closeLib(); openPage(d,0); } }
  else toast(sk.length?`開ける図面がありませんでした（${[...new Set(sk.map(n=>'.'+extOf(n)))].join(' ')} は未対応）`:'取り込めるファイルがありませんでした',4500);
});

/* ====================== controls ====================== */
$('#libBtn').onclick=openLib;
$('#fitBtn').onclick=fit;
$('#prevBtn').onclick=()=>{ if(S.doc&&S.pi>0) openPage(S.doc,S.pi-1); };
$('#nextBtn').onclick=()=>{ if(S.doc&&S.pi<S.doc.count-1) openPage(S.doc,S.pi+1); };
$('#modeSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setMode(b.dataset.mode); });
$('#rulerBtn').onclick=()=>{ const r=S.st.ruler; r.on=!r.on; if(r.on){ // bring into view
    const [x,y]=toS(r.x,r.y); if(x<0||y<0||x>S.W-60||y>S.H-60){ const [px,py]=toP(S.W*0.15,S.H*0.4); r.x=px; r.y=py; } }
  saveSt(); updateReadout(); draw(); };
$('#snapBtn').onclick=()=>{ S.snap=!S.snap; $('#snapBtn').setAttribute('aria-pressed',String(S.snap)); toast(S.snap?'端点に吸着します':'吸着をオフにしました',1400); };
$('#paperBtn').onclick=openPaper;
$('#delBtn').onclick=openDelete;
$('#faces').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; if(b.id==='customDen'){ openCustomDen(); return; } setDen(parseFloat(b.dataset.den)); });
window.addEventListener('keydown',e=>{ if(!$('#sheet').hidden||!$('#lib').hidden){ if(e.key==='Escape'){ closeSheet(); closeLib(); } return; }
  if(e.key==='Delete'||e.key==='Backspace') openDelete(); else if(e.key==='ArrowRight') $('#nextBtn').click(); else if(e.key==='ArrowLeft') $('#prevBtn').click(); else if(e.key==='Escape'){ S.pending=null; S.sel=-1; draw(); updateReadout(); } });
new ResizeObserver(()=>resize()).observe($('#stage'));
const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener&&mq.addEventListener('change',()=>{ readColors(); draw(); });
new MutationObserver(()=>{ readColors(); draw(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ====================== boot ====================== */
(async function boot(){
  readColors();
  if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js'; }
  resize();
  await refreshDocs();
  const last=LS.get('tscale:last',null); let d=last&&DOCS.find(x=>x.id===last.id); let pi=d?last.pi:0;
  if(!d){ d=DOCS[0]; pi=0; }
  if(d) await openPage(d,pi); else { $('#docTitle').textContent='図面三角スケール'; $('#pageTitle').textContent='図面を取り込んでください'; openLib(); }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>draw());
})();

function showOffState(){ const el=document.getElementById('offState'); if(!el) return;
  if(!('serviceWorker' in navigator)){ el.textContent='このブラウザはオフライン保存に対応していません。'; return; }
  navigator.serviceWorker.getRegistration().then(r=>{ el.innerHTML = (r&&r.active) ? '<b>オフライン準備完了</b>：このアプリは電波がなくても起動できます。ホーム画面に追加して使ってください。' : 'オフライン用の保存中です。電波のある場所で一度開いたままお待ちください。'; }); }
const HAD_SW = !!(navigator.serviceWorker&&navigator.serviceWorker.controller);
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(r=>{ r.addEventListener('updatefound',()=>{ const w=r.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='activated'){ showOffState(); if(HAD_SW) toast('新しい版を保存しました。次回起動から反映されます。',3500); else toast('オフライン準備ができました',2500); } }); }); }).catch(e=>console.warn(e)); }); }
</script>
